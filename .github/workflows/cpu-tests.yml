# The CPU tier, on every push and pull request.
#
# The repository already carried the safeguards this runs — the seed-regime
# audit, the canonical-input guard, the metric spec freeze, the inherited
# verifier audit — and nothing executed them. A `p3.target` segmentation
# regression consequently sat on `main`: the sentence verifier that decides the
# primary outcome had silently lost its abbreviation guard, and the test that
# exists to catch exactly that was red and unread.
#
# Two jobs, in parallel. `cpu` runs the preregistered protocol's suite
# (`tests/`) and the exploratory suite; `dci1` runs DCI-1's, a separate study
# with its own interpreter and lock. Everything here runs without any GPU stack. The
# hardware and `slow` tiers are deliberately excluded: they need the ROCm
# workstation, the Lambda API, or tens of minutes, and a CI job nobody waits
# for is a CI job nobody reads.
name: cpu-tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Batch 1 runs under CPython 3.12 only (D12)
          cache: pip

      # The scientific core depends on NO GPU stack by design; torch and
      # transformers arrive only through environments/rocm|cuda. If this step
      # ever needs one of them, that rule has been broken somewhere.
      - name: Install the core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Confirmatory suite (CPU tier)
        run: |
          pytest tests/ -q \
            -m "not slow and not gpu and not rocm and not cuda and not cloud"

      # Runs against the same install: the exploratory tests import
      # `dci_exploratory` and `crossmodel`, which reach the scientific
      # definitions through `dci`, and none of them loads a model.
      #
      # `if: always()` because the two suites are independent evidence. On the
      # first run of this workflow the confirmatory step failed on a known
      # pre-existing defect and this step never executed, so a green exploratory
      # result was withheld for an unrelated reason. A reader needs both.
      - name: Exploratory suite
        if: always()
        run: pytest exploratory/tests -q

  # DCI-1 (`dci1/`) is a separate uv project: Python 3.13, numpy, pyarrow and
  # pytest pinned in `dci1/uv.lock`, and no import of `src/dci` (so no z3; the
  # `cpu` job keeps the root pin). It was added after this workflow and never
  # ran here, so two backtests that raised `ProtocolError` from 7196123 until
  # PR #39 went unseen, and so did a v7 check that only passes where the
  # gitignored evidence tree exists.
  #
  # The environment is the one the study records: uv 0.10.12 and uv-managed
  # CPython 3.13.12, installed from the lock with `--frozen` (hash-checked, never
  # re-resolved). The fast tiers of the v8/v8.1 line (`tests_v8dev`) and of v7
  # (`tests_v7`) run, and so do the closed v2-v6 suites: v8.1 imports `dci1v4`
  # and `dci1v7`, so those suites are what notice a change that reaches a closed
  # study through shared code. They were left out until 2026-10-18, by which
  # time seven of their tests failed wherever the evidence tree is absent; those
  # now skip or are strict expected failures, as in `tests_v7`. The `slow`
  # lifecycle walks do not run. Tests that need the evidence tree skip, and
  # `-rsx` prints each skip and expected failure with its reason so the log says
  # what did not run.
  dci1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dci1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.10.12

      - name: Install the locked environment
        id: sync
        run: uv sync --frozen --managed-python --python 3.13.12

      # Floats computed through BLAS depend on the kernel OpenBLAS picks for the
      # host, and GitHub's runner pool mixes AVX2 and AVX-512 machines: the
      # legacy pre-screen's posterior summaries move by ~1e-10 between them
      # (see test_legacy_prescreen_characterization.FLOAT_ABS_TOL). Recorded so
      # a float-level result can be tied to the machine that produced it.
      - name: Record the machine
        run: |
          lscpu | grep '^Model name'
          grep -qw avx512f /proc/cpuinfo && echo "AVX-512: yes" || echo "AVX-512: no"
          OPENBLAS_VERBOSE=2 .venv/bin/python -c \
            "import numpy as np; np.ones((2, 2)) @ np.ones((2, 2)); print('numpy', np.__version__)"

      # `requirements-frozen.txt` is the lock's `uv export --frozen`, and the
      # v3/v4 environment records hash it; it had drifted from the lock once.
      - name: The lock is current and its export matches it
        run: |
          uv lock --check
          uv export --frozen | diff - requirements-frozen.txt

      # Serial: the peak is about 5 GB, and xdist would duplicate module
      # fixtures per worker.
      - name: v8 / v8.1 suite (tests_v8dev, not slow)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          .venv/bin/python -m pytest tests_v8dev -q -p no:cacheprovider \
            -m "not slow and not gpu" -rsx

      - name: v7 suite (tests_v7, not slow)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          .venv/bin/python -m pytest tests_v7 -q -p no:cacheprovider \
            -m "not slow and not gpu" -rsx

      # One pytest process per suite: they share test file names
      # (`test_isolation.py` is in v5, v6 and v7) and each has its own conftest.
      # Every suite runs; the step fails if any of them did.
      - name: closed suites (tests, tests_v3 ... tests_v6, not slow)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          rc=0
          for suite in tests tests_v3 tests_v4 tests_v4r3 tests_v4r4 tests_v5 tests_v6; do
            echo "::group::$suite"
            .venv/bin/python -m pytest "$suite" -q -p no:cacheprovider \
              -m "not slow and not gpu" -rsx || rc=1
            echo "::endgroup::"
          done
          exit $rc
