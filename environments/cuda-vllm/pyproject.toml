# Batch 1 CUDA vLLM backend: the interpreter that runs vLLM generation on the
# Lambda 2x H100 SXM instance, passed to the batch1 CLI as --backend-python
# with --accelerator cuda (D12, researcher's conditions of 2026-10-25).
#
# - Python 3.12 (vLLM's Docker default; native on Lambda GPU Base 24.04).
# - vllm 0.15.1 from PyPI: its CUDA wheel is cp38-abi3 and requires
#   torch==2.9.1.
# - torch, torchvision and torchaudio from the explicit PyTorch cu129 index,
#   so torch reports 2.9.1+cu129 and CUDA 12.9 (needs an NVIDIA driver
#   >= 575.51.03). Never `--torch-backend=auto`.
# - Linux x86_64 only: the lock resolves for that platform alone.
#
# Supersedes dci1/environments/backend-cuda (torch +cu128), which does not
# meet D12. Build on the host with `uv sync --frozen`; install nothing into
# the .venv after `attest-environment`, which binds the hash of every
# installed distribution.
[project]
name = "dci-batch1-cuda-vllm"
version = "1.0.0"
description = "Pinned CUDA vLLM backend for DCI Batch 1 (D12)"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.4.0",
    "huggingface-hub>=0.29.2",
    "numpy>=2.0.0,<=2.1.3",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "transformers>=4.56.0,<5",
    "vllm==0.15.1",
]

[tool.uv]
required-version = ">=0.5.3"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
