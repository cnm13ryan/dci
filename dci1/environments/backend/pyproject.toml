# DCI-1 backend environment — the ONLY interpreter that runs vLLM generation.
#
# Duplicated, per the researcher's amendment A2 (dci1/DECISIONS.md), from
# /home/cnm13ryan/git/inoculation-prompting/gcd_sycophancy/pyproject.toml:
# the newest vLLM/PyTorch stacks do not run reliably on this workstation, so
# the study pins the stack that does. GPU-stack pins are copied verbatim
# (vendored vLLM 0.15.1+rocm720 wheel; Radeon rocm-rel-7.2 torch wheel set);
# application-level dependencies of that project are deliberately dropped.
#
# Build:  cd dci1/environments/backend && uv sync
# The resulting .venv/bin/python is the backend interpreter recorded in every
# freeze record (decision D23). Wheel hashes: vendor/MANIFEST.sha256.
[project]
name = "dci1-backend"
version = "1.0.0"
description = "Pinned ROCm vLLM inference environment for the DCI-1 study"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.4.0",
    # amdsmi: required for vLLM's ROCm platform autodetection. vLLM imports it
    # softly inside rocm_platform_plugin() and silently falls back to
    # UnspecifiedPlatform on ImportError, which then trips
    # "Device string must not be empty" in DeviceConfig. Declaring it as a
    # hard dep ensures uv.lock always carries a [[package]] entry routed
    # through the vendored wheel (tool.uv.sources below).
    "amdsmi>=26.0.0 ; sys_platform == 'linux'",
    "huggingface-hub>=0.29.2",
    "numpy>=2.0.0,<=2.1.3",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=4.49.0,<5",
    "triton==3.5.1 ; sys_platform == 'linux'",
    "vllm==0.15.1",
]

[tool.uv]
required-version = ">=0.5.3"
override-dependencies = [
    "amd-aiter>=0.1.10 ; sys_platform == 'linux'",
    "amdsmi>=26.0.0 ; sys_platform == 'linux'",
    "flash-attn>=2.8.3 ; sys_platform == 'linux'",
    "torch @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/torch-2.9.1%2Brocm7.2.0.lw.git7e1940d4-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "torchaudio @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/torchaudio-2.9.0%2Brocm7.2.0.gite3c6ee2b-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "torchvision @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/torchvision-0.24.0%2Brocm7.2.0.gitb919bd0c-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "triton @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/triton-3.5.1%2Brocm7.2.0.gita272dfa8-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
    "triton-kernels @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/triton_kernels-1.0.0-py3-none-any.whl ; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "vllm-rocm"
url = "https://wheels.vllm.ai/rocm/"
explicit = true

[tool.uv.sources]
amd-aiter = [
    { index = "vllm-rocm", marker = "sys_platform == 'linux'" }
]
amdsmi = [
    { path = "vendor/amdsmi-26.2.1+fc0010cf6a-py3-none-any.whl", marker = "sys_platform == 'linux'" },
]
flash-attn = [
    { index = "vllm-rocm", marker = "sys_platform == 'linux'" }
]
vllm = [
    { path = "vendor/vllm-0.15.1+rocm720-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
